<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="445" viewBox="0 0 660 445">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="black"/>
    </marker>
  </defs>

  <rect x="3" y="3" width="654" height="439" fill="white" stroke="black" stroke-width="1"/>

  <!-- ══════════ КОЛОНКА 1 (x=115) ══════════ -->

  <!-- Начало -->
  <ellipse cx="115" cy="28" rx="52" ry="18" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="115" y="33" font-family="Times New Roman,serif" font-size="11" text-anchor="middle" font-style="italic">Начало</text>

  <line x1="115" y1="46" x2="115" y2="59" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Выбрать перевод клиенту банка -->
  <rect x="40" y="59" width="150" height="42" rx="4" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="115" y="76" font-family="Times New Roman,serif" font-size="9" text-anchor="middle" font-style="italic">Выбрать перевод</text>
  <text x="115" y="91" font-family="Times New Roman,serif" font-size="9" text-anchor="middle" font-style="italic">клиенту банка</text>

  <line x1="115" y1="101" x2="115" y2="114" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Выбрать способ перевода -->
  <rect x="40" y="114" width="150" height="42" rx="4" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="115" y="131" font-family="Times New Roman,serif" font-size="9" text-anchor="middle" font-style="italic">Выбрать способ</text>
  <text x="115" y="146" font-family="Times New Roman,serif" font-size="9" text-anchor="middle" font-style="italic">перевода</text>

  <line x1="115" y1="156" x2="115" y2="172" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Diamond: Перевод на счёт клиента? центр(115,200) -->
  <polygon points="115,172 195,200 115,228 35,200" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="115" y="196" font-family="Times New Roman,serif" font-size="8" text-anchor="middle" font-style="italic">Перевод на счёт</text>
  <text x="115" y="208" font-family="Times New Roman,serif" font-size="8" text-anchor="middle" font-style="italic">клиента?</text>

  <!-- Нет → влево -->
  <line x1="35" y1="200" x2="12" y2="200" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="22" y="194" font-family="Times New Roman,serif" font-size="8" text-anchor="middle" font-style="italic">Нет</text>

  <!-- Да → вниз -->
  <line x1="115" y1="228" x2="115" y2="244" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="122" y="241" font-family="Times New Roman,serif" font-size="8" text-anchor="start" font-style="italic">Да</text>

  <!-- Выбрать счёт, с которого клиент будет делать перевод -->
  <rect x="40" y="244" width="150" height="54" rx="4" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="115" y="261" font-family="Times New Roman,serif" font-size="9" text-anchor="middle" font-style="italic">Выбрать счёт,</text>
  <text x="115" y="275" font-family="Times New Roman,serif" font-size="9" text-anchor="middle" font-style="italic">с которого клиент</text>
  <text x="115" y="289" font-family="Times New Roman,serif" font-size="9" text-anchor="middle" font-style="italic">будет делать перевод</text>

  <line x1="115" y1="298" x2="115" y2="314" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Коннектор А -->
  <circle cx="115" cy="331" r="17" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="115" y="336" font-family="Times New Roman,serif" font-size="12" text-anchor="middle" font-style="italic">А</text>


  <!-- ══════════ КОЛОНКА 2 (x=355) ══════════ -->

  <!-- Коннектор А -->
  <circle cx="355" cy="28" r="17" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="355" y="33" font-family="Times New Roman,serif" font-size="12" text-anchor="middle" font-style="italic">А</text>

  <line x1="355" y1="45" x2="355" y2="58" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Ввести IBAN -->
  <rect x="275" y="58" width="160" height="54" rx="4" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="355" y="75" font-family="Times New Roman,serif" font-size="9" text-anchor="middle" font-style="italic">Ввести IBAN клиента,</text>
  <text x="355" y="89" font-family="Times New Roman,serif" font-size="9" text-anchor="middle" font-style="italic">которому будет</text>
  <text x="355" y="103" font-family="Times New Roman,serif" font-size="9" text-anchor="middle" font-style="italic">совершён перевод</text>

  <line x1="355" y1="112" x2="355" y2="128" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Diamond: IBAN введён правильно? центр(355,156) -->
  <polygon points="355,128 435,156 355,184 275,156" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="355" y="151" font-family="Times New Roman,serif" font-size="8" text-anchor="middle" font-style="italic">IBAN введён</text>
  <text x="355" y="163" font-family="Times New Roman,serif" font-size="8" text-anchor="middle" font-style="italic">правильно?</text>

  <!-- Нет → петля влево назад к IBAN -->
  <line x1="275" y1="156" x2="250" y2="156" stroke="black" stroke-width="1.2"/>
  <line x1="250" y1="156" x2="250" y2="85" stroke="black" stroke-width="1.2"/>
  <line x1="250" y1="85" x2="275" y2="85" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="248" y="150" font-family="Times New Roman,serif" font-size="8" text-anchor="end" font-style="italic">Нет</text>

  <!-- Да → вниз -->
  <line x1="355" y1="184" x2="355" y2="200" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="362" y="197" font-family="Times New Roman,serif" font-size="8" text-anchor="start" font-style="italic">Да</text>

  <!-- Ввести желаемую сумму -->
  <rect x="275" y="200" width="160" height="42" rx="4" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="355" y="217" font-family="Times New Roman,serif" font-size="9" text-anchor="middle" font-style="italic">Ввести желаемую</text>
  <text x="355" y="232" font-family="Times New Roman,serif" font-size="9" text-anchor="middle" font-style="italic">сумму</text>

  <line x1="355" y1="242" x2="355" y2="258" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Diamond: Сумма превышает ограничение? центр(355,286) -->
  <polygon points="355,258 435,286 355,314 275,286" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="355" y="281" font-family="Times New Roman,serif" font-size="8" text-anchor="middle" font-style="italic">Сумма превышает</text>
  <text x="355" y="293" font-family="Times New Roman,serif" font-size="8" text-anchor="middle" font-style="italic">ограничение?</text>

  <!-- Да → петля вправо назад к сумме -->
  <line x1="435" y1="286" x2="460" y2="286" stroke="black" stroke-width="1.2"/>
  <line x1="460" y1="286" x2="460" y2="221" stroke="black" stroke-width="1.2"/>
  <line x1="460" y1="221" x2="435" y2="221" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="462" y="280" font-family="Times New Roman,serif" font-size="8" text-anchor="start" font-style="italic">Да</text>

  <!-- Нет → вниз -->
  <line x1="355" y1="314" x2="355" y2="330" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="362" y="327" font-family="Times New Roman,serif" font-size="8" text-anchor="start" font-style="italic">Нет</text>

  <!-- Подтвердить перевод -->
  <rect x="275" y="330" width="160" height="40" rx="4" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="355" y="354" font-family="Times New Roman,serif" font-size="9" text-anchor="middle" font-style="italic">Подтвердить перевод</text>

  <line x1="355" y1="370" x2="355" y2="386" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Коннектор Б -->
  <circle cx="355" cy="403" r="17" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="355" y="408" font-family="Times New Roman,serif" font-size="12" text-anchor="middle" font-style="italic">Б</text>


  <!-- ══════════ КОЛОНКА 3 (x=565) ══════════ -->

  <!-- Коннектор Б -->
  <circle cx="565" cy="28" r="17" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="565" y="33" font-family="Times New Roman,serif" font-size="12" text-anchor="middle" font-style="italic">Б</text>

  <line x1="565" y1="45" x2="565" y2="58" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Ввести пасскод -->
  <rect x="490" y="58" width="150" height="42" rx="4" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="565" y="75" font-family="Times New Roman,serif" font-size="9" text-anchor="middle" font-style="italic">Ввести</text>
  <text x="565" y="90" font-family="Times New Roman,serif" font-size="9" text-anchor="middle" font-style="italic">пасскод</text>

  <line x1="565" y1="100" x2="565" y2="116" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Diamond: Пасскод введён верно? центр(565,144) -->
  <polygon points="565,116 645,144 565,172 485,144" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="565" y="139" font-family="Times New Roman,serif" font-size="8" text-anchor="middle" font-style="italic">Пасскод</text>
  <text x="565" y="151" font-family="Times New Roman,serif" font-size="8" text-anchor="middle" font-style="italic">введён верно?</text>

  <!-- Нет → петля влево назад к пасскоду -->
  <line x1="485" y1="144" x2="460" y2="144" stroke="black" stroke-width="1.2"/>
  <line x1="460" y1="144" x2="460" y2="79" stroke="black" stroke-width="1.2"/>
  <line x1="460" y1="79" x2="490" y2="79" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="458" y="138" font-family="Times New Roman,serif" font-size="8" text-anchor="end" font-style="italic">Нет</text>

  <!-- Да → вниз -->
  <line x1="565" y1="172" x2="565" y2="188" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="572" y="185" font-family="Times New Roman,serif" font-size="8" text-anchor="start" font-style="italic">Да</text>

  <!-- Конец -->
  <ellipse cx="565" cy="210" rx="52" ry="18" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="565" y="215" font-family="Times New Roman,serif" font-size="11" text-anchor="middle" font-style="italic">Конец</text>

</svg>
