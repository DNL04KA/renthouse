<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="950" height="580" viewBox="0 0 950 580">

  <rect x="5" y="5" width="940" height="570" fill="white" stroke="black" stroke-width="1.5"/>
  <rect x="9" y="9" width="932" height="562" fill="none" stroke="black" stroke-width="0.5"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="black"/>
    </marker>
  </defs>

  <!-- ============================================================ -->
  <!-- ВНЕШНИЕ ССЫЛКИ (прямые прямоугольники)                      -->
  <!-- ============================================================ -->

  <!-- Арендатор (слева сверху) -->
  <rect x="20" y="50" width="110" height="40" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="75" y="75" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Арендатор</text>

  <!-- Арендодатель (слева снизу) -->
  <rect x="20" y="270" width="110" height="40" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="75" y="295" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Арендодатель</text>

  <!-- Администратор (справа) -->
  <rect x="820" y="160" width="110" height="40" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="875" y="185" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Администратор</text>

  <!-- ============================================================ -->
  <!-- РАБОТЫ (закруглённые прямоугольники с номером)              -->
  <!-- ============================================================ -->

  <!-- 1. Аутентификация пользователя -->
  <rect x="200" y="40" width="160" height="55" rx="10" ry="10" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="280" y="63" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Аутентификация</text>
  <text x="280" y="79" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">пользователя</text>
  <text x="208" y="90" font-family="Times New Roman, serif" font-size="9">1</text>

  <!-- 2. Управление объектами недвижимости -->
  <rect x="200" y="245" width="160" height="55" rx="10" ry="10" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="280" y="265" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Управление</text>
  <text x="280" y="280" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">объектами</text>
  <text x="280" y="295" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">недвижимости</text>
  <text x="208" y="295" font-family="Times New Roman, serif" font-size="9">2</text>

  <!-- 3. Обработка заявки на аренду -->
  <rect x="490" y="140" width="160" height="55" rx="10" ry="10" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="570" y="160" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Обработка</text>
  <text x="570" y="175" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">заявки на аренду</text>
  <text x="498" y="190" font-family="Times New Roman, serif" font-size="9">3</text>

  <!-- 4. Контроль платежей -->
  <rect x="490" y="330" width="160" height="55" rx="10" ry="10" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="570" y="350" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Контроль</text>
  <text x="570" y="365" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">арендных</text>
  <text x="570" y="380" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">платежей</text>
  <text x="498" y="380" font-family="Times New Roman, serif" font-size="9">4</text>

  <!-- ============================================================ -->
  <!-- ХРАНИЛИЩА ДАННЫХ (двойные линии)                            -->
  <!-- ============================================================ -->

  <!-- БД пользователей -->
  <line x1="200" y1="430" x2="430" y2="430" stroke="black" stroke-width="1.5"/>
  <line x1="200" y1="448" x2="430" y2="448" stroke="black" stroke-width="1.5"/>
  <text x="205" y="443" font-family="Times New Roman, serif" font-size="11">БД пользователей</text>

  <!-- БД объектов недвижимости -->
  <line x1="200" y1="490" x2="480" y2="490" stroke="black" stroke-width="1.5"/>
  <line x1="200" y1="508" x2="480" y2="508" stroke="black" stroke-width="1.5"/>
  <text x="205" y="503" font-family="Times New Roman, serif" font-size="11">БД объектов недвижимости</text>

  <!-- Документация по договорам -->
  <line x1="530" y1="430" x2="810" y2="430" stroke="black" stroke-width="1.5"/>
  <line x1="530" y1="448" x2="810" y2="448" stroke="black" stroke-width="1.5"/>
  <text x="535" y="443" font-family="Times New Roman, serif" font-size="11">Документация по договорам</text>

  <!-- ============================================================ -->
  <!-- СТРЕЛКИ                                                      -->
  <!-- ============================================================ -->

  <!-- Арендатор → Блок 1 -->
  <line x1="130" y1="70" x2="198" y2="68" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="133" y="63" font-family="Times New Roman, serif" font-size="10">Запрос входа</text>

  <!-- Арендодатель → Блок 2 -->
  <line x1="130" y1="290" x2="198" y2="280" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="133" y="283" font-family="Times New Roman, serif" font-size="10">Данные объекта</text>

  <!-- Блок 1 → Блок 3 (напрямую) -->
  <line x1="360" y1="68" x2="488" y2="163" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="385" y="105" font-family="Times New Roman, serif" font-size="10">Данные пользователя</text>

  <!-- Блок 2 → Блок 3 (напрямую) -->
  <line x1="360" y1="272" x2="488" y2="195" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="375" y="238" font-family="Times New Roman, serif" font-size="10">Заявка на аренду</text>

  <!-- Блок 3 → Блок 4 (напрямую) -->
  <line x1="570" y1="195" x2="570" y2="328" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="575" y="270" font-family="Times New Roman, serif" font-size="10">Договор аренды</text>

  <!-- Блок 3 → Администратор -->
  <line x1="650" y1="168" x2="818" y2="178" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="660" y="163" font-family="Times New Roman, serif" font-size="10">Рекомендации</text>

  <!-- Блок 4 → Администратор -->
  <line x1="650" y1="358" x2="820" y2="198" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="700" y="295" font-family="Times New Roman, serif" font-size="10">Уведомления</text>

  <!-- Блок 1 → БД пользователей -->
  <line x1="280" y1="95" x2="280" y2="428" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="285" y="270" font-family="Times New Roman, serif" font-size="10">Запись данных</text>

  <!-- Блок 2 → БД объектов -->
  <line x1="255" y1="300" x2="255" y2="488" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="215" y="400" font-family="Times New Roman, serif" font-size="10">Данные объекта</text>

  <!-- Блок 4 → Документация по договорам -->
  <line x1="600" y1="385" x2="650" y2="428" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="570" y="415" font-family="Times New Roman, serif" font-size="10">Сохранение</text>

  <!-- Арендатор → Блок 4 (оплата) - слева длинная -->
  <line x1="75" y1="90" x2="75" y2="357" stroke="black" stroke-width="1.2"/>
  <line x1="75" y1="357" x2="488" y2="357" stroke="black" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="78" y="230" font-family="Times New Roman, serif" font-size="10">Оплата</text>
  <text x="78" y="242" font-family="Times New Roman, serif" font-size="10">аренды</text>

  <!-- Подпись -->
  <text x="475" y="565" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">
    Рисунок 2.6 – DFD-диаграмма процесса «Управление арендой недвижимости»
  </text>

</svg>
