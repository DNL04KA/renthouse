<?xml version="1.0" encoding="UTF-8"?>
<svg width="670" height="660" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#222"/>
    </marker>
  </defs>

  <!-- ========== КОЛОНКА 1 ========== -->

  <!-- Начало -->
  <ellipse cx="150" cy="35" rx="60" ry="20" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="150" y="40" text-anchor="middle">Начало</text>

  <line x1="150" y1="55" x2="150" y2="78" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Ввести логин и пароль -->
  <rect x="62" y="80" width="176" height="50" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="150" y="101" text-anchor="middle">Ввести логин</text>
  <text x="150" y="118" text-anchor="middle">и пароль</text>

  <line x1="150" y1="130" x2="150" y2="158" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Ромб: Данные верны? -->
  <polygon points="150,160 250,197 150,234 50,197" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="150" y="193" text-anchor="middle">Данные</text>
  <text x="150" y="209" text-anchor="middle">верны?</text>

  <!-- Нет — возврат влево вверх -->
  <polyline points="50,197 14,197 14,105 62,105" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="29" y="189" text-anchor="middle" font-size="11">Нет</text>

  <!-- Да — вниз -->
  <line x1="150" y1="234" x2="150" y2="260" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="133" y="252" font-size="11">Да</text>

  <!-- Перейти в «Финансы» -->
  <rect x="62" y="262" width="176" height="50" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="150" y="283" text-anchor="middle">Перейти в раздел</text>
  <text x="150" y="300" text-anchor="middle">«Финансы»</text>

  <line x1="150" y1="312" x2="150" y2="338" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Система загружает список платежей -->
  <rect x="62" y="340" width="176" height="50" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="150" y="361" text-anchor="middle">Система загружает</text>
  <text x="150" y="378" text-anchor="middle">список платежей</text>

  <line x1="150" y1="390" x2="150" y2="416" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Выбрать платёж из таблицы -->
  <rect x="62" y="418" width="176" height="50" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="150" y="439" text-anchor="middle">Выбрать платёж</text>
  <text x="150" y="456" text-anchor="middle">из таблицы</text>

  <line x1="150" y1="468" x2="150" y2="496" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Ромб: Статус «Оплачено»? -->
  <polygon points="150,498 255,535 150,572 45,535" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="150" y="531" text-anchor="middle">Статус</text>
  <text x="150" y="547" text-anchor="middle">«Оплачено»?</text>

  <!-- Да — вправо, кнопка недоступна -->
  <line x1="255" y1="535" x2="265" y2="535" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="257" y="527" font-size="11">Да</text>
  <rect x="267" y="516" width="105" height="40" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="320" y="533" text-anchor="middle" font-size="11">Кнопка</text>
  <text x="320" y="549" text-anchor="middle" font-size="11">недоступна</text>

  <!-- Нет — вниз к коннектору А -->
  <line x1="150" y1="572" x2="150" y2="598" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="133" y="590" font-size="11">Нет</text>

  <!-- Коннектор А (низ колонки 1) -->
  <circle cx="150" cy="620" r="18" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="150" y="625" text-anchor="middle" font-size="13" font-weight="bold">А</text>


  <!-- ========== КОЛОНКА 2 ========== -->

  <!-- Коннектор А (верх колонки 2) -->
  <circle cx="470" cy="35" r="18" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="470" y="40" text-anchor="middle" font-size="13" font-weight="bold">А</text>

  <line x1="470" y1="53" x2="470" y2="78" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Нажать «Оплатить» -->
  <rect x="382" y="80" width="176" height="50" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="470" y="101" text-anchor="middle">Нажать кнопку</text>
  <text x="470" y="118" text-anchor="middle">«Оплатить»</text>

  <line x1="470" y1="130" x2="470" y2="158" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Запрос к серверу -->
  <rect x="382" y="160" width="176" height="50" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="470" y="181" text-anchor="middle">Запрос к серверу</text>
  <text x="470" y="198" text-anchor="middle">PATCH /payments/{id}/pay</text>

  <line x1="470" y1="210" x2="470" y2="238" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Ромб: Платёж найден? -->
  <polygon points="470,240 575,277 470,314 365,277" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="470" y="273" text-anchor="middle">Платёж</text>
  <text x="470" y="289" text-anchor="middle">найден?</text>

  <!-- Нет — вправо, ошибка -->
  <line x1="575" y1="277" x2="585" y2="277" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="578" y="269" font-size="11">Нет</text>
  <rect x="587" y="258" width="76" height="40" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="625" y="275" text-anchor="middle" font-size="11">Ошибка</text>
  <text x="625" y="291" text-anchor="middle" font-size="11">сервера</text>

  <!-- Да — вниз -->
  <line x1="470" y1="314" x2="470" y2="340" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="453" y="332" font-size="11">Да</text>

  <!-- Обновить статус → «Оплачено» -->
  <rect x="382" y="342" width="176" height="50" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="470" y="363" text-anchor="middle">Обновить статус</text>
  <text x="470" y="380" text-anchor="middle">платежа → «Оплачено»</text>

  <line x1="470" y1="392" x2="470" y2="418" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Уведомление «Оплачено!» -->
  <rect x="382" y="420" width="176" height="50" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="470" y="441" text-anchor="middle">Уведомление</text>
  <text x="470" y="458" text-anchor="middle">«Оплачено!»</text>

  <line x1="470" y1="470" x2="470" y2="496" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Конец -->
  <ellipse cx="470" cy="518" rx="60" ry="20" fill="white" stroke="#222" stroke-width="2"/>
  <text x="470" y="523" text-anchor="middle">Конец</text>

</svg>
