<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="960" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#222"/>
    </marker>
  </defs>

  <!-- Начало -->
  <ellipse cx="150" cy="35" rx="60" ry="20" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="150" y="40" text-anchor="middle">Начало</text>

  <line x1="150" y1="55" x2="150" y2="78" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Ввести логин и пароль -->
  <rect x="60" y="80" width="180" height="50" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="150" y="101" text-anchor="middle">Ввести логин</text>
  <text x="150" y="118" text-anchor="middle">и пароль</text>

  <line x1="150" y1="130" x2="150" y2="158" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Данные верны? -->
  <polygon points="150,160 245,195 150,230 55,195" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="150" y="190" text-anchor="middle">Данные</text>
  <text x="150" y="207" text-anchor="middle">верны?</text>

  <!-- Нет — возврат к вводу -->
  <polyline points="55,195 12,195 12,105 60,105" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="30" y="188" text-anchor="middle" font-size="11">Нет</text>

  <!-- Да — вниз -->
  <line x1="150" y1="230" x2="150" y2="256" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="133" y="248" font-size="11">Да</text>

  <!-- Перейти в «Финансы» -->
  <rect x="60" y="258" width="180" height="50" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="150" y="279" text-anchor="middle">Перейти в раздел</text>
  <text x="150" y="296" text-anchor="middle">«Финансы»</text>

  <line x1="150" y1="308" x2="150" y2="334" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Система загружает список платежей -->
  <rect x="60" y="336" width="180" height="50" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="150" y="357" text-anchor="middle">Система загружает</text>
  <text x="150" y="374" text-anchor="middle">список платежей</text>

  <line x1="150" y1="386" x2="150" y2="412" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Выбрать платёж из таблицы -->
  <rect x="60" y="414" width="180" height="50" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="150" y="435" text-anchor="middle">Выбрать платёж</text>
  <text x="150" y="452" text-anchor="middle">из таблицы</text>

  <line x1="150" y1="464" x2="150" y2="490" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Нажать «Оплатить» -->
  <rect x="60" y="492" width="180" height="50" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="150" y="513" text-anchor="middle">Нажать кнопку</text>
  <text x="150" y="530" text-anchor="middle">«Оплатить»</text>

  <line x1="150" y1="542" x2="150" y2="568" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Запрос к серверу -->
  <rect x="60" y="570" width="180" height="50" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="150" y="591" text-anchor="middle">Запрос к серверу</text>
  <text x="150" y="608" text-anchor="middle">PATCH /payments/{id}/pay</text>

  <line x1="150" y1="620" x2="150" y2="646" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Запрос успешен? -->
  <polygon points="150,648 248,685 150,722 52,685" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="150" y="680" text-anchor="middle">Запрос</text>
  <text x="150" y="697" text-anchor="middle">успешен?</text>

  <!-- Нет — возврат к «Нажать «Оплатить»» -->
  <polyline points="52,685 12,685 12,517 60,517" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="30" y="677" text-anchor="middle" font-size="11">Нет</text>

  <!-- Да — вниз -->
  <line x1="150" y1="722" x2="150" y2="748" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="133" y="740" font-size="11">Да</text>

  <!-- Обновить статус -->
  <rect x="60" y="750" width="180" height="50" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="150" y="771" text-anchor="middle">Обновить статус</text>
  <text x="150" y="788" text-anchor="middle">платежа → «Оплачено»</text>

  <line x1="150" y1="800" x2="150" y2="826" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Уведомление -->
  <rect x="60" y="828" width="180" height="50" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="150" y="849" text-anchor="middle">Уведомление</text>
  <text x="150" y="866" text-anchor="middle">«Оплачено!»</text>

  <line x1="150" y1="878" x2="150" y2="904" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Конец -->
  <ellipse cx="150" cy="926" rx="60" ry="20" fill="white" stroke="#222" stroke-width="2"/>
  <text x="150" y="931" text-anchor="middle">Конец</text>

</svg>
