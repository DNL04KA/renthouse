<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="960" viewBox="0 0 1300 960">
  <defs>
    <!-- Открытый треугольный наконечник для «include»/«extend» -->
    <marker id="open_arrow" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0 0 L11 4.5 L0 9" fill="none" stroke="black" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Фон -->
  <rect x="0" y="0" width="1300" height="960" fill="white"/>

  <!-- Граница системы -->
  <rect x="158" y="18" width="980" height="924" fill="white" stroke="black" stroke-width="1.5"/>

  <!-- Заголовок системы -->
  <text x="648" y="43" font-family="Times New Roman,serif" font-size="15"
        text-anchor="middle" font-weight="bold">АСУ аренды недвижимости</text>

  <!-- ═══════════════════════════════════════════════════
       ЛЕВАЯ КОЛОНКА ВАРИАНТОВ ИСПОЛЬЗОВАНИЯ  cx = 400
       ═══════════════════════════════════════════════════ -->

  <!-- UC1: Просматривать объекты недвижимости -->
  <ellipse cx="400" cy="92"  rx="125" ry="21" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="400" y="88"  font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">Просматривать объекты</text>
  <text x="400" y="102" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">недвижимости</text>

  <!-- UC2: Оставить заявку на объект -->
  <ellipse cx="400" cy="178" rx="125" ry="21" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="400" y="174" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">Оставить заявку</text>
  <text x="400" y="188" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">на объект</text>

  <!-- UC3: Авторизоваться (разделяющий) -->
  <ellipse cx="400" cy="290" rx="125" ry="21" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="400" y="294" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">Авторизоваться</text>

  <!-- UC4: Зарегистрироваться в системе -->
  <ellipse cx="400" cy="378" rx="125" ry="21" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="400" y="374" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">Зарегистрироваться</text>
  <text x="400" y="388" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">в системе</text>

  <!-- UC5: Просматривать договор аренды -->
  <ellipse cx="400" cy="498" rx="125" ry="21" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="400" y="494" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">Просматривать договор</text>
  <text x="400" y="508" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">аренды</text>

  <!-- UC6: Просматривать историю платежей -->
  <ellipse cx="400" cy="585" rx="125" ry="21" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="400" y="581" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">Просматривать историю</text>
  <text x="400" y="595" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">платежей</text>

  <!-- UC7: Производить оплату аренды -->
  <ellipse cx="400" cy="672" rx="125" ry="21" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="400" y="668" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">Производить оплату</text>
  <text x="400" y="682" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">аренды</text>

  <!-- UC8: Продлить / изменить договор -->
  <ellipse cx="400" cy="765" rx="125" ry="21" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="400" y="761" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">Продлить / изменить</text>
  <text x="400" y="775" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">договор</text>

  <!-- ═══════════════════════════════════════════════════
       ПРАВАЯ КОЛОНКА ВАРИАНТОВ ИСПОЛЬЗОВАНИЯ  cx = 910
       ═══════════════════════════════════════════════════ -->

  <!-- UC9: Обработать заявку на аренду -->
  <ellipse cx="910" cy="92"  rx="125" ry="21" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="910" y="88"  font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">Обработать заявку</text>
  <text x="910" y="102" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">на аренду</text>

  <!-- UC10: Ответить на заявку арендатора -->
  <ellipse cx="910" cy="190" rx="125" ry="21" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="910" y="186" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">Ответить на заявку</text>
  <text x="910" y="200" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">арендатора</text>

  <!-- UC11: Заключить договор аренды -->
  <ellipse cx="910" cy="288" rx="125" ry="21" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="910" y="284" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">Заключить договор</text>
  <text x="910" y="298" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">аренды</text>

  <!-- UC12: Рассчитать задолженность -->
  <ellipse cx="910" cy="425" rx="125" ry="21" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="910" y="429" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">Рассчитать задолженность</text>

  <!-- UC13: Сформировать графики платежей -->
  <ellipse cx="910" cy="518" rx="125" ry="21" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="910" y="514" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">Сформировать графики</text>
  <text x="910" y="528" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">платежей</text>

  <!-- UC14: Просматривать отчёт по объектам -->
  <ellipse cx="910" cy="630" rx="125" ry="21" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="910" y="626" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">Просматривать отчёт</text>
  <text x="910" y="640" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">по объектам</text>

  <!-- UC15: Просматривать отчёт по задолженности -->
  <ellipse cx="910" cy="718" rx="125" ry="21" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="910" y="714" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">Просматривать отчёт</text>
  <text x="910" y="728" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">по задолженности</text>

  <!-- UC16: Управлять пользователями и ролями -->
  <ellipse cx="910" cy="825" rx="125" ry="21" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="910" y="821" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">Управлять пользователями</text>
  <text x="910" y="835" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">и ролями</text>

  <!-- UC17: Создать учётную запись пользователя -->
  <ellipse cx="910" cy="913" rx="125" ry="21" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="910" y="909" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">Создать учётную запись</text>
  <text x="910" y="923" font-family="Times New Roman,serif" font-size="10.5" text-anchor="middle">пользователя</text>

  <!-- ═══════════════════════════════════════════════════
       ОТНОШЕНИЯ «include» / «extend»
       Открытый треугольный наконечник, пунктирная линия
       ═══════════════════════════════════════════════════ -->

  <!-- UC2 ──«include»──► UC3 -->
  <line x1="400" y1="199" x2="400" y2="269"
        stroke="black" stroke-width="1.2" stroke-dasharray="7,4"
        marker-end="url(#open_arrow)"/>
  <text x="418" y="238" font-family="Times New Roman,serif" font-size="9.5" font-style="italic">«include»</text>

  <!-- UC3 ◄──«extend»── UC4  (стрелка указывает на UC3) -->
  <line x1="400" y1="357" x2="400" y2="311"
        stroke="black" stroke-width="1.2" stroke-dasharray="7,4"
        marker-end="url(#open_arrow)"/>
  <text x="418" y="338" font-family="Times New Roman,serif" font-size="9.5" font-style="italic">«extend»</text>

  <!-- UC9 ──«include»──► UC3  (диагональ через схему) -->
  <line x1="786" y1="100" x2="525" y2="284"
        stroke="black" stroke-width="1.2" stroke-dasharray="7,4"
        marker-end="url(#open_arrow)"/>
  <text x="638" y="175" font-family="Times New Roman,serif" font-size="9.5" font-style="italic"
        transform="rotate(-21 638 175)">«include»</text>

  <!-- UC9 ──«include»──► UC10 -->
  <line x1="910" y1="113" x2="910" y2="169"
        stroke="black" stroke-width="1.2" stroke-dasharray="7,4"
        marker-end="url(#open_arrow)"/>
  <text x="928" y="145" font-family="Times New Roman,serif" font-size="9.5" font-style="italic">«include»</text>

  <!-- UC10 ──«include»──► UC11 -->
  <line x1="910" y1="211" x2="910" y2="267"
        stroke="black" stroke-width="1.2" stroke-dasharray="7,4"
        marker-end="url(#open_arrow)"/>
  <text x="928" y="243" font-family="Times New Roman,serif" font-size="9.5" font-style="italic">«include»</text>

  <!-- UC12 ──«include»──► UC13  (стрелка вниз) -->
  <line x1="910" y1="446" x2="910" y2="497"
        stroke="black" stroke-width="1.2" stroke-dasharray="7,4"
        marker-end="url(#open_arrow)"/>
  <text x="928" y="476" font-family="Times New Roman,serif" font-size="9.5" font-style="italic">«include»</text>

  <!-- UC16 ──«include»──► UC17  (стрелка вниз) -->
  <line x1="910" y1="846" x2="910" y2="892"
        stroke="black" stroke-width="1.2" stroke-dasharray="7,4"
        marker-end="url(#open_arrow)"/>
  <text x="928" y="872" font-family="Times New Roman,serif" font-size="9.5" font-style="italic">«include»</text>

  <!-- ═══════════════════════════════════════════════════
       АКТОР 1: Незарегистрированный пользователь
       Центр фигуры ~y=225
       ═══════════════════════════════════════════════════ -->
  <circle cx="78" cy="200" r="14" fill="white" stroke="black" stroke-width="1.3"/>
  <line x1="78" y1="214" x2="78" y2="243" stroke="black" stroke-width="1.3"/>
  <line x1="56"  y1="228" x2="100" y2="228" stroke="black" stroke-width="1.3"/>
  <line x1="78"  y1="243" x2="63"  y2="268" stroke="black" stroke-width="1.3"/>
  <line x1="78"  y1="243" x2="93"  y2="268" stroke="black" stroke-width="1.3"/>
  <text x="78" y="287" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">Незарегистри-</text>
  <text x="78" y="299" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">рованный</text>
  <text x="78" y="311" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">пользователь</text>
  <!-- Линии к UC1–UC4 -->
  <line x1="100" y1="228" x2="275" y2="92"  stroke="black" stroke-width="1"/>
  <line x1="100" y1="228" x2="275" y2="178" stroke="black" stroke-width="1"/>
  <line x1="100" y1="228" x2="275" y2="290" stroke="black" stroke-width="1"/>
  <line x1="100" y1="228" x2="275" y2="378" stroke="black" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════════════
       АКТОР 2: Арендатор
       Центр фигуры ~y=610
       ═══════════════════════════════════════════════════ -->
  <circle cx="78" cy="600" r="14" fill="white" stroke="black" stroke-width="1.3"/>
  <line x1="78" y1="614" x2="78" y2="643" stroke="black" stroke-width="1.3"/>
  <line x1="56"  y1="628" x2="100" y2="628" stroke="black" stroke-width="1.3"/>
  <line x1="78"  y1="643" x2="63"  y2="668" stroke="black" stroke-width="1.3"/>
  <line x1="78"  y1="643" x2="93"  y2="668" stroke="black" stroke-width="1.3"/>
  <text x="78" y="687" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">Арендатор</text>
  <!-- Линии к UC5–UC8 -->
  <line x1="100" y1="628" x2="275" y2="498" stroke="black" stroke-width="1"/>
  <line x1="100" y1="628" x2="275" y2="585" stroke="black" stroke-width="1"/>
  <line x1="100" y1="628" x2="275" y2="672" stroke="black" stroke-width="1"/>
  <line x1="100" y1="628" x2="275" y2="765" stroke="black" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════════════
       АКТОР 3: Менеджер по аренде
       Центр фигуры ~y=190
       ═══════════════════════════════════════════════════ -->
  <circle cx="1222" cy="180" r="14" fill="white" stroke="black" stroke-width="1.3"/>
  <line x1="1222" y1="194" x2="1222" y2="223" stroke="black" stroke-width="1.3"/>
  <line x1="1200" y1="208" x2="1244" y2="208" stroke="black" stroke-width="1.3"/>
  <line x1="1222" y1="223" x2="1207" y2="248" stroke="black" stroke-width="1.3"/>
  <line x1="1222" y1="223" x2="1237" y2="248" stroke="black" stroke-width="1.3"/>
  <text x="1222" y="267" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">Менеджер</text>
  <text x="1222" y="279" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">по аренде</text>
  <!-- Линии к UC9–UC11 -->
  <line x1="1200" y1="208" x2="1035" y2="92"  stroke="black" stroke-width="1"/>
  <line x1="1200" y1="208" x2="1035" y2="190" stroke="black" stroke-width="1"/>
  <line x1="1200" y1="208" x2="1035" y2="288" stroke="black" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════════════
       АКТОР 4: Бухгалтер по аренде
       Центр фигуры ~y=470
       ═══════════════════════════════════════════════════ -->
  <circle cx="1222" cy="460" r="14" fill="white" stroke="black" stroke-width="1.3"/>
  <line x1="1222" y1="474" x2="1222" y2="503" stroke="black" stroke-width="1.3"/>
  <line x1="1200" y1="488" x2="1244" y2="488" stroke="black" stroke-width="1.3"/>
  <line x1="1222" y1="503" x2="1207" y2="528" stroke="black" stroke-width="1.3"/>
  <line x1="1222" y1="503" x2="1237" y2="528" stroke="black" stroke-width="1.3"/>
  <text x="1222" y="547" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">Бухгалтер</text>
  <text x="1222" y="559" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">по аренде</text>
  <!-- Линии к UC12, UC13 -->
  <line x1="1200" y1="488" x2="1035" y2="425" stroke="black" stroke-width="1"/>
  <line x1="1200" y1="488" x2="1035" y2="518" stroke="black" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════════════
       АКТОР 5: Руководитель
       Центр фигуры ~y=670
       ═══════════════════════════════════════════════════ -->
  <circle cx="1222" cy="660" r="14" fill="white" stroke="black" stroke-width="1.3"/>
  <line x1="1222" y1="674" x2="1222" y2="703" stroke="black" stroke-width="1.3"/>
  <line x1="1200" y1="688" x2="1244" y2="688" stroke="black" stroke-width="1.3"/>
  <line x1="1222" y1="703" x2="1207" y2="728" stroke="black" stroke-width="1.3"/>
  <line x1="1222" y1="703" x2="1237" y2="728" stroke="black" stroke-width="1.3"/>
  <text x="1222" y="747" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">Руководитель</text>
  <!-- Линии к UC14, UC15 -->
  <line x1="1200" y1="688" x2="1035" y2="630" stroke="black" stroke-width="1"/>
  <line x1="1200" y1="688" x2="1035" y2="718" stroke="black" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════════════
       АКТОР 6: Администратор системы
       Центр фигуры ~y=868
       ═══════════════════════════════════════════════════ -->
  <circle cx="1222" cy="858" r="14" fill="white" stroke="black" stroke-width="1.3"/>
  <line x1="1222" y1="872" x2="1222" y2="901" stroke="black" stroke-width="1.3"/>
  <line x1="1200" y1="886" x2="1244" y2="886" stroke="black" stroke-width="1.3"/>
  <line x1="1222" y1="901" x2="1207" y2="926" stroke="black" stroke-width="1.3"/>
  <line x1="1222" y1="901" x2="1237" y2="926" stroke="black" stroke-width="1.3"/>
  <text x="1222" y="945" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">Администратор</text>
  <text x="1222" y="957" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">системы</text>
  <!-- Линии к UC16, UC17 -->
  <line x1="1200" y1="886" x2="1035" y2="825" stroke="black" stroke-width="1"/>
  <line x1="1200" y1="886" x2="1035" y2="913" stroke="black" stroke-width="1"/>

</svg>
