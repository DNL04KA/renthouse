    <line x1="5" y1="0" x2="5" y2="10" stroke="#555" stroke-width="1.2"/>
  </marker>
  <!-- One (||) — marker-end (для 1:1) -->
  <marker id="one-end" viewBox="-8 0 8 10" refX="0" refY="5"
          markerWidth="8" markerHeight="10" orient="auto"
          markerUnits="userSpaceOnUse">
