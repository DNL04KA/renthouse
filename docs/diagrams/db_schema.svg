<defs>
  <!-- Crow's foot (many) — marker-end -->
  <marker id="many" viewBox="-10 0 10 10" refX="0" refY="5"
          markerWidth="10" markerHeight="10" orient="auto"
          markerUnits="userSpaceOnUse">
    <line x1="0" y1="5" x2="-8" y2="1" stroke="#555" stroke-width="1.2"/>
    <line x1="0" y1="5" x2="-8" y2="5" stroke="#555" stroke-width="1.2"/>
    <line x1="0" y1="5" x2="-8" y2="9" stroke="#555" stroke-width="1.2"/>
  </marker>
  <!-- One (||) — marker-start -->
