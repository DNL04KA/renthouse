<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">

  <rect x="10" y="10" width="940" height="620" fill="white" stroke="black" stroke-width="1.5"/>
  <rect x="14" y="14" width="932" height="612" fill="none" stroke="black" stroke-width="0.5"/>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>

  <!-- ======= РЯД 1: Блоки 1-4 (слева направо) ======= -->

  <!-- Блок 1 -->
  <rect x="25" y="60" width="130" height="55" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="90" y="83" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Запрос</text>
  <text x="90" y="98" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">пользователя</text>
  <text x="30" y="110" font-family="Times New Roman, serif" font-size="9">$0    1</text>

  <!-- Блок 2 -->
  <rect x="205" y="60" width="130" height="55" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="270" y="83" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Проверка данных</text>
  <text x="270" y="98" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">пользователя</text>
  <text x="210" y="110" font-family="Times New Roman, serif" font-size="9">$0    2</text>

  <!-- Блок 3 -->
  <rect x="385" y="60" width="130" height="55" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="450" y="83" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Поиск объекта</text>
  <text x="450" y="98" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">недвижимости</text>
  <text x="390" y="110" font-family="Times New Roman, serif" font-size="9">$0    3</text>

  <!-- Блок 4 -->
  <rect x="565" y="60" width="140" height="55" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="635" y="83" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Проверка</text>
  <text x="635" y="98" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">доступности объекта</text>
  <text x="570" y="110" font-family="Times New Roman, serif" font-size="9">$0    4</text>

  <!-- Стрелки ряд 1 -->
  <line x1="155" y1="87" x2="203" y2="87" stroke="black" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="335" y1="87" x2="383" y2="87" stroke="black" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="515" y1="87" x2="563" y2="87" stroke="black" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="705" y1="87" x2="743" y2="87" stroke="black" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ======= J1 (XOR) ======= -->
  <circle cx="760" cy="87" r="18" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="760" y="93" font-family="Times New Roman, serif" font-size="14" text-anchor="middle" font-weight="bold">X</text>
  <text x="760" y="74" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">J1</text>

  <!-- J1 → Уведомление об отказе (вправо) -->
  <line x1="778" y1="87" x2="860" y2="87" stroke="black" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="790" y="80" font-family="Times New Roman, serif" font-size="10">объект занят</text>
  <rect x="860" y="65" width="75" height="45" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="897" y="85" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">Уведомление</text>
  <text x="897" y="100" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">об отказе</text>

  <!-- J1 → Блок 5 (вниз) -->
  <line x1="760" y1="105" x2="760" y2="178" stroke="black" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="765" y="145" font-family="Times New Roman, serif" font-size="10">объект свободен</text>

  <!-- ======= Блок 5 ======= -->
  <rect x="685" y="178" width="150" height="55" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="760" y="201" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Оформление заявки</text>
  <text x="760" y="216" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">на аренду</text>
  <text x="690" y="228" font-family="Times New Roman, serif" font-size="9">$0    5</text>

  <!-- Блок 5 → J2 -->
  <line x1="760" y1="233" x2="760" y2="278" stroke="black" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ======= J2 (OR) ======= -->
  <circle cx="760" cy="295" r="18" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="760" y="301" font-family="Times New Roman, serif" font-size="14" text-anchor="middle" font-weight="bold">O</text>
  <text x="760" y="282" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">J2</text>

  <!-- J2 → Блок 6 (влево) -->
  <line x1="742" y1="295" x2="580" y2="295" stroke="black" stroke-width="1.5"/>
  <line x1="580" y1="295" x2="580" y2="348" stroke="black" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- J2 → Блок 7 (вправо) -->
  <line x1="778" y1="295" x2="880" y2="295" stroke="black" stroke-width="1.5"/>
  <line x1="880" y1="295" x2="880" y2="348" stroke="black" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ======= Блок 6: Создание договора ======= -->
  <rect x="500" y="348" width="155" height="55" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="577" y="371" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Создание договора</text>
  <text x="577" y="386" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">аренды</text>
  <text x="505" y="398" font-family="Times New Roman, serif" font-size="9">$0    6</text>

  <!-- ======= Блок 7: Регистрация платежа ======= -->
  <rect x="800" y="348" width="155" height="55" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="877" y="371" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Регистрация</text>
  <text x="877" y="386" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">арендного платежа</text>
  <text x="805" y="398" font-family="Times New Roman, serif" font-size="9">$0    7</text>

  <!-- Блок 6 → J3 -->
  <line x1="577" y1="403" x2="577" y2="460" stroke="black" stroke-width="1.5"/>
  <line x1="577" y1="460" x2="742" y2="460" stroke="black" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Блок 7 → J3 -->
  <line x1="877" y1="403" x2="877" y2="460" stroke="black" stroke-width="1.5"/>
  <line x1="877" y1="460" x2="778" y2="460" stroke="black" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ======= J3 (AND) ======= -->
  <circle cx="760" cy="460" r="18" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="760" y="466" font-family="Times New Roman, serif" font-size="14" text-anchor="middle" font-weight="bold">&amp;</text>
  <text x="760" y="447" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">J3</text>

  <!-- J3 → Блок 8 (вниз) -->
  <line x1="760" y1="478" x2="760" y2="528" stroke="black" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ======= Блок 8: Подтверждение аренды ======= -->
  <rect x="685" y="528" width="150" height="55" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="760" y="551" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Подтверждение</text>
  <text x="760" y="566" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">аренды</text>
  <text x="690" y="578" font-family="Times New Roman, serif" font-size="9">$0    8</text>

  <!-- Подпись -->
  <text x="480" y="620" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">
    Рисунок 2.7 – IDEF3-диаграмма процесса «Оформление аренды недвижимости»
  </text>

</svg>
