  <line x1="80" y1="518" x2="192" y2="495" stroke="black" stroke-width="1"/>
  <line x1="80" y1="518" x2="192" y2="560" stroke="black" stroke-width="1"/>
  <line x1="80" y1="518" x2="192" y2="625" stroke="black" stroke-width="1"/>

  <!-- ══════════════════════════════════════
       АКТОР 3: Менеджер по аренде
       cx=1040, head_cy=105, arm_y=128
       ══════════════════════════════════════ -->
