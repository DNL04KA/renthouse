<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="730" viewBox="0 0 1100 730">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="black"/>
    </marker>
  </defs>

  <!-- Фон -->
  <rect x="1" y="1" width="1098" height="728" fill="white" stroke="black" stroke-width="1"/>

  <!-- Граница системы -->
  <rect x="128" y="12" width="844" height="700" fill="none" stroke="black" stroke-width="2"/>
  <text x="550" y="30" font-family="Times New Roman,serif" font-size="13"
        text-anchor="middle" font-weight="bold" font-style="italic">АСУ аренды недвижимости</text>

  <!-- ══════════════════════════════════════
       ЛЕВАЯ КОЛОНКА вариантов использования
       cx=300, rx=108, ry=15
       ══════════════════════════════════════ -->

  <!-- UC1 -->
  <ellipse cx="300" cy="85"  rx="108" ry="15" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="300" y="82"  font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">Просматривать объект</text>
  <text x="300" y="94"  font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">недвижимости</text>

  <!-- UC2 -->
  <ellipse cx="300" cy="145" rx="108" ry="15" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="300" y="142" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">Оставить заявку</text>
  <text x="300" y="154" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">на объект</text>

  <!-- UC3 -->
  <ellipse cx="300" cy="255" rx="108" ry="15" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="300" y="259" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">Авторизоваться</text>

  <!-- UC4 -->
  <ellipse cx="300" cy="315" rx="108" ry="15" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="300" y="312" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">Зарегистрироваться</text>
  <text x="300" y="324" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">в системе</text>

  <!-- UC5 -->
  <ellipse cx="300" cy="430" rx="108" ry="15" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="300" y="427" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">Просматривать договор</text>
  <text x="300" y="439" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">аренды</text>

  <!-- UC6 -->
  <ellipse cx="300" cy="495" rx="108" ry="15" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="300" y="492" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">Просматривать историю</text>
  <text x="300" y="504" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">платежей</text>

  <!-- UC7 -->
  <ellipse cx="300" cy="560" rx="108" ry="15" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="300" y="557" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">Производить оплату</text>
  <text x="300" y="569" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">аренды</text>

  <!-- UC8 -->
  <ellipse cx="300" cy="625" rx="108" ry="15" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="300" y="622" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">Продлить / изменить</text>
  <text x="300" y="634" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">договор</text>

  <!-- ══════════════════════════════════════
       ПРАВАЯ КОЛОНКА вариантов использования
       cx=770, rx=108, ry=15
       ══════════════════════════════════════ -->

  <!-- UC9 -->
  <ellipse cx="770" cy="85"  rx="108" ry="15" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="770" y="82"  font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">Обработать заявку</text>
  <text x="770" y="94"  font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">на аренду</text>

  <!-- UC10 -->
  <ellipse cx="770" cy="150" rx="108" ry="15" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="770" y="147" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">Ответить на заявку</text>
  <text x="770" y="159" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">арендатора</text>

  <!-- UC11 -->
  <ellipse cx="770" cy="215" rx="108" ry="15" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="770" y="212" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">Заключить договор</text>
  <text x="770" y="224" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">аренды</text>

  <!-- UC12 -->
  <ellipse cx="770" cy="310" rx="108" ry="15" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="770" y="314" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">Рассчитать задолженность</text>

  <!-- UC13 -->
  <ellipse cx="770" cy="375" rx="108" ry="15" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="770" y="372" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">Сформировать графики</text>
  <text x="770" y="384" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">платежей</text>

  <!-- UC14 -->
  <ellipse cx="770" cy="455" rx="108" ry="15" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="770" y="452" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">Просматривать отчёт</text>
  <text x="770" y="464" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">по объектам</text>

  <!-- UC15 -->
  <ellipse cx="770" cy="520" rx="108" ry="15" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="770" y="517" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">Просматривать отчёт</text>
  <text x="770" y="529" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">по задолженности</text>

  <!-- UC16 -->
  <ellipse cx="770" cy="610" rx="108" ry="15" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="770" y="607" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">Управлять пользователями</text>
  <text x="770" y="619" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">и ролями</text>

  <!-- UC17 -->
  <ellipse cx="770" cy="670" rx="108" ry="15" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="770" y="667" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">Создать учётную запись</text>
  <text x="770" y="679" font-family="Times New Roman,serif" font-size="8.5" text-anchor="middle" font-style="italic">пользователя</text>

  <!-- ══════════════════════════════════════════════
       ОТНОШЕНИЯ «включить» (пунктирные стрелки)
       Стрелка направлена К включаемому прецеденту
       ══════════════════════════════════════════════ -->

  <!-- UC2 -«включить»-> UC3: Оставить заявку включает Авторизоваться (вертикально) -->
  <line x1="300" y1="160" x2="300" y2="240"
        stroke="black" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="316" y="204" font-family="Times New Roman,serif" font-size="8"
        text-anchor="start" font-style="italic">«включить»</text>

  <!-- UC9 -«включить»-> UC3: Обработать заявку включает Авторизоваться
       (длинная диагональ — пересекает схему, как в образце) -->
  <line x1="662" y1="88" x2="408" y2="248"
        stroke="black" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="548" y="156" font-family="Times New Roman,serif" font-size="8"
        text-anchor="middle" font-style="italic" transform="rotate(-19,548,156)">«включить»</text>

  <!-- UC13 -«включить»-> UC12: Графики платежей включает Расчёт задолженности -->
  <line x1="770" y1="360" x2="770" y2="325"
        stroke="black" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="784" y="344" font-family="Times New Roman,serif" font-size="8"
        text-anchor="start" font-style="italic">«включить»</text>

