  <line x1="62" y1="507" x2="62" y2="532" stroke="black" stroke-width="1.3"/>
  <line x1="44" y1="518" x2="80" y2="518" stroke="black" stroke-width="1.3"/>
  <line x1="62" y1="532" x2="49" y2="552" stroke="black" stroke-width="1.3"/>
