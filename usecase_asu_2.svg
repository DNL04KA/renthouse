       ══════════════════════════════════════ -->
  <circle cx="1040" cy="625" r="12" fill="white" stroke="black" stroke-width="1.3"/>
  <line x1="1040" y1="637" x2="1040" y2="662" stroke="black" stroke-width="1.3"/>
  <line x1="1022" y1="648" x2="1058" y2="648" stroke="black" stroke-width="1.3"/>
