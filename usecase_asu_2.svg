  <line x1="80" y1="228" x2="192" y2="145" stroke="black" stroke-width="1"/>
  <line x1="80" y1="228" x2="192" y2="255" stroke="black" stroke-width="1"/>
  <line x1="80" y1="228" x2="192" y2="315" stroke="black" stroke-width="1"/>

