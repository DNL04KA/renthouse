  <!-- ══ INCLUDE / EXTEND ARROWS ══ -->

  <!-- 1. «include»  Оставить заявку (320,163) → Авторизоваться (320,252) -->
  <line x1="320" y1="179" x2="320" y2="236"
        stroke="black" stroke-width="1" stroke-dasharray="5,3"
        marker-end="url(#open-arr)"/>
  <text x="333" y="211" font-family="Times New Roman,serif" font-size="8.5" font-style="italic">«include»</text>

  <!-- 2. «extend»  Зарегистрироваться (320,337) → Авторизоваться (320,252) -->
  <line x1="320" y1="321" x2="320" y2="268"
        stroke="black" stroke-width="1" stroke-dasharray="5,3"
        marker-end="url(#open-arr)"/>
  <text x="333" y="297" font-family="Times New Roman,serif" font-size="8.5" font-style="italic">«extend»</text>

  <!-- 3. «include»  Ответить на заявку (880,168) → Обработать заявку (880,78) -->
  <line x1="880" y1="152" x2="880" y2="94"
        stroke="black" stroke-width="1" stroke-dasharray="5,3"
        marker-end="url(#open-arr)"/>
  <text x="893" y="126" font-family="Times New Roman,serif" font-size="8.5" font-style="italic">«include»</text>

  <!-- 4. «include»  Заключить договор (880,258) → Ответить на заявку (880,168) -->
  <line x1="880" y1="242" x2="880" y2="184"
        stroke="black" stroke-width="1" stroke-dasharray="5,3"
        marker-end="url(#open-arr)"/>
  <text x="893" y="215" font-family="Times New Roman,serif" font-size="8.5" font-style="italic">«include»</text>

  <!-- 5. «include»  Сформировать графики (880,458) → Рассчитать задолженность (880,378) -->
  <line x1="880" y1="442" x2="880" y2="394"
        stroke="black" stroke-width="1" stroke-dasharray="5,3"
        marker-end="url(#open-arr)"/>
  <text x="893" y="420" font-family="Times New Roman,serif" font-size="8.5" font-style="italic">«include»</text>

