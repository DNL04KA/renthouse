  <text x="600" y="30" font-family="Times New Roman,serif" font-size="14" text-anchor="middle" font-weight="bold" font-style="italic">АСУ аренды недвижимости</text>

  <!-- ══ LEFT COLUMN  cx=320  rx=115  ry=16 ══ -->

  <!-- Незарегистрированный пользователь -->
