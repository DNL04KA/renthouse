<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910">
  <defs>
    <marker id="open-arr" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polyline points="0,1 10,4.5 0,8" fill="none" stroke="black" stroke-width="1.3"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="908" fill="white" stroke="black" stroke-width="1"/>
